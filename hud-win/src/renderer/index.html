<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
  <title>Agent HUD</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!--
    胶囊只承载「环 + 金额」（2026-10-25 设计）：
      收起态 = 纯环；悬停态 = 环 + 今日金额。
      统计区与按钮组已移除 —— 左键点击胶囊展开详情卡片；
      刷新 / 隐藏 / 退出走系统托盘菜单；设置入口在卡片右上角。
  -->
  <div id="bar" class="bar">
    <!-- 每个 agent 一个 mark：圆环 + logo + 金额（金额仅悬停时显示） -->
    <div class="marks" id="marks"></div>
  </div>

  <!--
    详情卡片（左键点胶囊展开 / ✕ 收起）。
    内容 = 原版四段（2026-10-25 恢复）：概况行 / 模型用量条 / 最近会话 / 额度区；
    视觉风格沿用改版：panel-top（Tab 在左 + ⚙/✕ 固定右上角）。
    原「限流区」不恢复 —— Beta 限流监测功能已于 2026-10-25 整体删除。
  -->
  <div class="panel" id="panel">
    <div class="panel-top">
      <div class="panel-tabs" id="panelTabs"></div>
      <div class="panel-actions">
        <button class="icon-btn" id="settingsBtn" title="设置">⚙</button>
        <button class="icon-btn" id="closeBtn" title="收起">✕</button>
      </div>
    </div>

    <!-- 当前 Tab 的概要行：源名 + 会话数 + 今日花费 -->
    <div class="panel-head">
      <span id="tabTitle">全部模型（24h 调用量）</span>
      <span class="panel-time" id="allModelsNote"></span>
    </div>
    <div class="all-models" id="allModels"></div>

    <div class="panel-head">
      <span>模型用量</span>
      <span class="panel-time" id="panelTime"></span>
    </div>
    <div class="bars" id="bars"></div>

    <div class="panel-head">
      <span>最近会话</span>
      <span class="panel-time" id="filterNote"></span>
    </div>
    <div class="sessions" id="sessions"></div>

    <!--
      额度 —— 放在「最近会话」之后（想细看才看的次要信息）。
      内容按当前 Tab 决定（见 renderer.js 的 renderQuotas 调用处）：
        · ALL / DSH Tab → WorkBuddy 积分（DSH 才有积分概念）
        · Codex Tab     → 中转站余额（Codex 走中转站时官方额度接口拿不到）
        · Codex Tab     → GPT 官方百分比（官方登录态的 5h/周窗口；走中转时
                          上游不下发该字段，整段不渲染，不编造百分比）
      多段并存时标题显示为「额度」。右上角时间戳只在拿到数据时显示。
    -->
    <div id="quotaSection">
      <div class="panel-head">
        <span>额度（积分）</span>
        <span class="panel-time" id="quotaNote"></span>
      </div>
      <div class="quotas" id="quotas"></div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
